<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - Côte à Côte</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header data-header data-no-map></header>

  <main class="auth">
    <div class="container">
      <a href="carte.html" class="btn btn-light">&larr; &nbsp;Retour à la carte</a>
      <form class="auth-box" id="form-auth" style="margin-top:110px">
        <h1>Inscription</h1>
        <label for="nom">Nom / Adresse mail</label>
        <input class="inp" id="nom" name="nom" placeholder="Nom / Mail" required>
        <label for="pwd">Mot de passe</label>
        <input class="inp" id="pwd" name="password" type="password" placeholder="Mot de passe" required>
        <label for="pwd2">Confirmer le Mot de passe</label>
        <input class="inp" id="pwd2" name="confirm" type="password" placeholder="Mot de passe" required>
        <label for="asso">Association</label>
        <input class="inp" id="asso" name="association" placeholder="Association (facultatif)">
        <div class="err"></div>
        <button class="btn btn-teal">Créer mon compte</button>
        <a href="connexion.html" class="link">Se connecter</a>
      </form>
    </div>
  </main>

  <footer data-footer></footer>
  <script src="js/main.js"></script>
</body>
</html>
